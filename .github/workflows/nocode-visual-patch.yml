name: One-time noCodeE2E visual patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nocode-visual-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch noCodeE2E scroll story
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          replacements = [
              ('''    .nocode-step{display:inline-block;margin-left:-5px;padding:0 5px;border-radius:6px}\n    .nocode-wire{position:absolute;z-index:1;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}\n    .nocode-wire path{fill:none;stroke:#8ea9ff;stroke-width:.42;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:.78}\n    .nocode-wire .traveler{fill:#eef2ff;opacity:0;filter:drop-shadow(0 0 7px rgba(142,169,255,.9))}\n    .nocode-runner{position:absolute;z-index:3;right:clamp(16px,2vw,28px);bottom:clamp(16px,2vw,26px);display:grid;grid-template-columns:34px auto;gap:10px;align-items:center;padding:10px 13px;border:1px solid rgba(200,213,255,.28);border-radius:13px;background:rgba(8,12,20,.9);box-shadow:0 16px 45px rgba(0,0,0,.32);opacity:0;transform:translateY(12px) scale(.96);will-change:transform,opacity}\n''', '''    .nocode-step{display:inline-block;margin-left:-5px;padding:0 5px;border-radius:6px;will-change:background-color,box-shadow,opacity}\n    .nocode-runner{position:absolute;z-index:3;left:50%;top:57%;display:grid;grid-template-columns:34px auto;gap:10px;align-items:center;padding:10px 13px;border:1px solid rgba(200,213,255,.28);border-radius:13px;background:rgba(8,12,20,.92);box-shadow:0 18px 52px rgba(0,0,0,.42);opacity:0;transform:translate(-50%,calc(-50% + 12px)) scale(.96);will-change:transform,opacity;pointer-events:none}\n'''),
              ('''.code-plate{padding:18px;align-items:flex-start;overflow:hidden}.code-plate pre{font-size:.7rem;line-height:1.5}.nocode-runner{right:10px;bottom:10px;grid-template-columns:27px auto;gap:7px;padding:8px 9px;border-radius:10px}.nocode-runner svg{width:27px;height:27px}.nocode-runner small{font-size:.48rem}.nocode-runner strong{font-size:.62rem}.nocode-runner .check{width:14px;height:14px;font-size:.56rem}''', '''.code-plate{padding:18px;align-items:flex-start;overflow:hidden}.code-plate pre{font-size:.7rem;line-height:1.5}.nocode-runner{left:50%;top:60%;grid-template-columns:27px auto;gap:7px;padding:8px 9px;border-radius:10px}.nocode-runner svg{width:27px;height:27px}.nocode-runner small{font-size:.48rem}.nocode-runner strong{font-size:.62rem}.nocode-runner .check{width:14px;height:14px;font-size:.56rem}'''),
              ('''.nocode-step{background:rgba(142,169,255,.14);box-shadow:0 0 0 1px rgba(142,169,255,.18)}.nocode-wire path{stroke-dashoffset:0}.nocode-wire .traveler{display:none}.nocode-runner{opacity:1;transform:none}''', '''.nocode-step[data-nocode-step="2"]{background:rgba(142,169,255,.14);box-shadow:0 0 0 1px rgba(142,169,255,.18)}.nocode-runner{opacity:1;transform:translate(-50%,-50%)}'''),
              ('''  - <span class="key">open:</span> /\n  - <span class="key">fill:</span>\n''', '''<span class="nocode-step" data-nocode-step="0">  - <span class="key">open:</span> /</span>\n<span class="nocode-step" data-nocode-step="1">  - <span class="key">fill:</span></span>\n'''),
              ('''<span class="nocode-step">  - <span class="key">click:</span> login.submit</span>''', '''<span class="nocode-step" data-nocode-step="2">  - <span class="key">click:</span> login.submit</span>'''),
              ('''      <svg class="nocode-wire" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M 39 56 C 58 56 59 77 76 77"></path><circle class="traveler" cx="39" cy="56" r=".72"></circle></svg>\n''', ''''''),
              ('''if(scene.dataset.scene==='2'){const phase=clamp((rel+.32)/.64),focus=clamp((phase-.14)/.18),draw=clamp((phase-.30)/.30),result=clamp((phase-.62)/.18),stepNode=scene.querySelector('.nocode-step'),path=scene.querySelector('.nocode-wire path'),traveler=scene.querySelector('.nocode-wire .traveler'),runner=scene.querySelector('.nocode-runner');if(stepNode){const f=focus*(1-clamp((phase-.82)/.18)*.35);stepNode.style.backgroundColor=`rgba(142,169,255,${f*.15})`;stepNode.style.boxShadow=`0 0 0 1px rgba(142,169,255,${f*.22}),0 0 ${18*f}px rgba(142,169,255,${f*.18})`}if(path){path.style.strokeDashoffset=String(1-draw);if(traveler){if(draw>0){const len=path.getTotalLength(),p=path.getPointAtLength(len*draw);traveler.setAttribute('cx',p.x.toFixed(2));traveler.setAttribute('cy',p.y.toFixed(2));traveler.style.opacity=String(clamp(draw*1.6)*(1-result*.45))}else traveler.style.opacity='0'}}if(runner){runner.style.opacity=String(result);runner.style.transform=`translate3d(0,${(1-result)*12}px,0) scale(${.96+result*.04})`}}''', '''if(scene.dataset.scene==='2'){const phase=clamp((rel+.34)/.68),runner=scene.querySelector('.nocode-runner'),stepNodes=[...scene.querySelectorAll('.nocode-step')],ranges=[[.04,.36],[.30,.64],[.58,1.02]],result=smooth(clamp((phase-.78)/.14));stepNodes.forEach((stepNode,stepIndex)=>{const range=ranges[stepIndex],enter=smooth(clamp((phase-range[0])/.07)),exit=stepIndex===2?1-result*.12:1-smooth(clamp((phase-(range[1]-.07))/.07)),focus=enter*exit;stepNode.style.backgroundColor=`rgba(142,169,255,${focus*.15})`;stepNode.style.boxShadow=`0 0 0 1px rgba(142,169,255,${focus*.22}),0 0 ${18*focus}px rgba(142,169,255,${focus*.18})`;stepNode.style.opacity=String(.72+focus*.28)});if(runner){runner.style.opacity=String(result);runner.style.transform=`translate(-50%,calc(-50% + ${(1-result)*12}px)) scale(${.96+result*.04})`}}'''),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected noCodeE2E patch target was not found')
              s = s.replace(old, new, 1)

          if 'nocode-wire' in s:
              raise SystemExit('Old noCodeE2E curve animation still present')
          if s.count('data-nocode-step=') != 3:
              raise SystemExit('Expected exactly three highlighted YAML commands')

          p.write_text(s)
          PY

          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refine noCodeE2E scroll execution sequence'
          git push
