name: One-time CueSheet motion patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cuesheet-motion-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch CueSheet scroll story
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          copy_before = s[s.index('    const copy={'):s.index('    const meta=')]

          css_old = '''    .cuesheet-desktop{left:max(3vw,calc((100% - var(--content))/2));top:12%;width:min(57vw,760px);height:min(66vh,640px)}.phone{position:absolute;z-index:10;width:min(14vw,195px);aspect-ratio:9/18.7;overflow:hidden;border-radius:24px;border:1px solid rgba(255,255,255,.25);box-shadow:0 28px 80px rgba(0,0,0,.48);background:#111;will-change:transform,opacity}.phone img{width:100%;height:100%;object-fit:cover}.phone.one{left:clamp(4vw,8vw,130px);bottom:6%}.phone.two{left:clamp(18vw,24vw,360px);bottom:2%}\n'''
          css_new = '''    .cuesheet-desktop{left:max(3vw,calc((100% - var(--content))/2));top:12%;width:min(57vw,760px);height:min(66vh,640px);isolation:isolate}.cuesheet-desktop .cue-frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;will-change:opacity,transform,filter}.cuesheet-desktop .cue-workspace{z-index:1}.cuesheet-desktop .cue-conflict{z-index:2;opacity:0}.cuesheet-desktop .cue-review{z-index:3;opacity:0}.phone{position:absolute;z-index:10;width:min(14vw,195px);aspect-ratio:9/18.7;overflow:hidden;border-radius:24px;border:1px solid rgba(255,255,255,.25);box-shadow:0 28px 80px rgba(0,0,0,.48);background:#111;will-change:transform,opacity}.phone img{width:100%;height:100%;object-fit:cover}.phone.one{left:clamp(4vw,8vw,130px);bottom:6%}.phone.two{left:clamp(18vw,24vw,360px);bottom:2%}\n'''

          html_old = '''<div class="plate cuesheet-desktop scene-object"><img src="https://raw.githubusercontent.com/CTWalk/CueSheet_demo/main/assets/production-workspace.png" alt="CueSheet production workspace" /></div><div class="phone one scene-object" aria-hidden="true"><img src="https://raw.githubusercontent.com/CTWalk/CueSheet_demo/main/assets/mobile-stage-call-sheet.png" alt="" /></div><div class="phone two scene-object" aria-hidden="true"><img src="https://raw.githubusercontent.com/CTWalk/CueSheet_demo/main/assets/mobile-cast-member.png" alt="" /></div>'''
          html_new = '''<div class="plate cuesheet-desktop scene-object"><img class="cue-frame cue-workspace" src="https://raw.githubusercontent.com/CTWalk/CueSheet_demo/main/assets/production-workspace.png" alt="CueSheet production workspace" /><img class="cue-frame cue-conflict" src="https://raw.githubusercontent.com/CTWalk/CueSheet_demo/main/assets/conflict-status.png" alt="CueSheet conflict response status" /><img class="cue-frame cue-review" src="https://raw.githubusercontent.com/CTWalk/CueSheet_demo/main/assets/schedule-review.png" alt="CueSheet schedule change review" /></div><div class="phone one scene-object cue-phone-manager" aria-hidden="true"><img src="https://raw.githubusercontent.com/CTWalk/CueSheet_demo/main/assets/mobile-stage-call-sheet.png" alt="" /></div><div class="phone two scene-object cue-phone-cast" aria-hidden="true"><img src="https://raw.githubusercontent.com/CTWalk/CueSheet_demo/main/assets/mobile-cast-member.png" alt="" /></div>'''

          js_old = '''if(scene.dataset.scene==='2'){const phase=clamp((rel+.34)/.68),runner=scene.querySelector('.nocode-runner'),stepNodes=[...scene.querySelectorAll('.nocode-step')],ranges=[[.04,.36],[.30,.64],[.58,1.02]],result=smooth(clamp((phase-.78)/.14));stepNodes.forEach((stepNode,stepIndex)=>{const range=ranges[stepIndex],enter=smooth(clamp((phase-range[0])/.07)),exit=stepIndex===2?1-result*.12:1-smooth(clamp((phase-(range[1]-.07))/.07)),focus=enter*exit;stepNode.style.backgroundColor=`rgba(142,169,255,${focus*.15})`;stepNode.style.boxShadow=`0 0 0 1px rgba(142,169,255,${focus*.22}),0 0 ${18*focus}px rgba(142,169,255,${focus*.18})`;stepNode.style.opacity=String(.72+focus*.28)});if(runner){runner.style.opacity=String(result);runner.style.transform=`translate(-50%,calc(-50% + ${(1-result)*12}px)) scale(${.96+result*.04})`}}'''
          js_new = js_old + '''if(scene.dataset.scene==='4'){const phase=clamp((rel+.34)/.68),workspace=scene.querySelector('.cue-workspace'),conflict=scene.querySelector('.cue-conflict'),review=scene.querySelector('.cue-review'),manager=scene.querySelector('.cue-phone-manager'),cast=scene.querySelector('.cue-phone-cast'),conflictIn=smooth(clamp((phase-.18)/.14)),reviewIn=smooth(clamp((phase-.44)/.14)),publish=smooth(clamp((phase-.76)/.15)),sceneAlpha=clamp(opacity*1.12);if(workspace){workspace.style.opacity=String(1-conflictIn);workspace.style.transform=`scale(${1+conflictIn*.015})`}if(conflict){const a=conflictIn*(1-reviewIn);conflict.style.opacity=String(a);conflict.style.transform=`scale(${1.025-conflictIn*.025})`}if(review){review.style.opacity=String(reviewIn);review.style.transform=`translate3d(0,${(1-reviewIn)*10}px,0) scale(${1.015-reviewIn*.015})`;review.style.filter=`brightness(${1-publish*.14})`}if(manager){const a=1-conflictIn;manager.style.opacity=String(sceneAlpha*a);manager.style.transform=`translate3d(${pointer.x*7+rel*24}px,${pointer.y*5+rel*28}px,0) scale(${1-Math.min(.07,Math.abs(rel)*.035)-conflictIn*.04})`}if(cast){const a=Math.max(1-conflictIn,publish),lift=publish*(mobile?-14:-24),slide=publish*(mobile?18:38);cast.style.opacity=String(sceneAlpha*a);cast.style.transform=`translate3d(${pointer.x*-8+rel*-28+slide}px,${pointer.y*6+rel*30+lift}px,0) scale(${1-Math.min(.07,Math.abs(rel)*.035)+publish*(mobile?.12:.2)})`;cast.style.zIndex=publish>.5?'13':'10'}}'''

          reduced_old = '''@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.experience{height:auto}'''
          reduced_new = '''@media(prefers-reduced-motion:reduce){.cuesheet-desktop .cue-workspace,.cuesheet-desktop .cue-conflict{opacity:0!important}.cuesheet-desktop .cue-review{opacity:1!important}.cue-phone-manager{opacity:0!important}html{scroll-behavior:auto}.experience{height:auto}'''

          for old, new, label in [
              (css_old, css_new, 'CueSheet CSS'),
              (html_old, html_new, 'CueSheet scene HTML'),
              (js_old, js_new, 'CueSheet scroll JS'),
              (reduced_old, reduced_new, 'reduced motion CSS'),
          ]:
              if old not in s:
                  raise SystemExit(f'Expected {label} target was not found')
              s = s.replace(old, new, 1)

          copy_after = s[s.index('    const copy={'):s.index('    const meta=')]
          if copy_after != copy_before:
              raise SystemExit('Portfolio copy changed unexpectedly')
          if s.count('class="cue-frame') != 3:
              raise SystemExit('Expected exactly three CueSheet desktop states')
          if 'assets/conflict-status.png' not in s or 'assets/schedule-review.png' not in s:
              raise SystemExit('CueSheet evidence assets missing')

          p.write_text(s)
          PY

          git diff --check

      - name: Commit CueSheet motion and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/cuesheet-motion-patch.yml
          git add index.html .github/workflows/cuesheet-motion-patch.yml
          git commit -m 'Add CueSheet conflict-to-replan scroll story'
          git push
