name: One-time Decision Audit scroll story

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/decision-audit-story.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Decision Audit false-pass scroll story
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          # Give only the Audit story extra scroll distance.
          old = '.experience{position:relative;height:calc(var(--scene-count) * 112vh);height:calc(var(--scene-count) * 112svh);background:#0b0d0f}'
          new = '.experience{position:relative;height:calc(var(--scroll-units,var(--scene-count)) * 112vh);height:calc(var(--scroll-units,var(--scene-count)) * 112svh);background:#0b0d0f}'
          if old not in s:
              raise SystemExit('Experience height target not found')
          s = s.replace(old, new, 1)
          s = s.replace('style="--scene-count:7"', 'style="--scene-count:7;--scroll-units:8.2"', 1)

          # Audit storytelling styles: one focused real row, then one tiny inspection state.
          css_anchor = '    .pr-status.open::after{content:"";position:absolute;left:6px;top:7px;width:16px;height:11px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;border-radius:0 0 0 8px}\n'
          css_add = '''    .pr-status.open::after{content:"";position:absolute;left:6px;top:7px;width:16px;height:11px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;border-radius:0 0 0 8px}\n    .audit-focus-row{position:relative;z-index:2;transform-origin:center;will-change:transform,opacity,box-shadow}\n    .audit-proof{position:absolute;z-index:5;left:50%;top:50%;width:min(78%,430px);height:150px;transform:translate(-50%,-50%);opacity:0;pointer-events:none;will-change:opacity,transform}\n    .audit-pass,.audit-verdict{position:absolute;left:0;right:0;top:27px;display:flex;align-items:center;justify-content:center;gap:12px;color:#eef2ff;font:720 clamp(1.65rem,3vw,2.8rem)/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:-.04em;will-change:opacity,transform}\n    .audit-pass .audit-symbol{display:grid;width:42px;height:42px;place-items:center;border-radius:50%;background:rgba(125,230,181,.12);color:#9be9c2;font-size:1.2rem;border:1px solid rgba(155,233,194,.26)}\n    .audit-verdict{opacity:0;color:#e7dcff}.audit-verdict .audit-symbol{display:grid;width:42px;height:42px;place-items:center;border-radius:50%;border:1px solid rgba(165,128,235,.45);color:#b99af0;font-size:1.2rem}\n    .audit-checks{position:absolute;left:0;right:0;top:92px;text-align:center;color:rgba(255,255,255,.7);font:650 clamp(.8rem,1.2vw,1rem)/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;opacity:0;will-change:opacity,transform}.audit-checks b{color:#fff;font-size:1.22em}\n    .audit-scan{position:absolute;top:11px;bottom:11px;left:0;width:1px;background:linear-gradient(to bottom,transparent,rgba(200,213,255,.94) 25%,rgba(200,213,255,.94) 75%,transparent);box-shadow:0 0 20px rgba(142,169,255,.72);opacity:0;will-change:left,opacity}\n    .zh-only{display:none}html[lang^="zh"] .en-only{display:none}html[lang^="zh"] .zh-only{display:inline}\n'''
          if css_anchor not in s:
              raise SystemExit('Audit CSS anchor not found')
          s = s.replace(css_anchor, css_add, 1)

          # Keep the real merged zero-check contribution as the row the visitor follows.
          focus_old = '<div class="audit-row"><span class="pr-status merged"></span><div><strong>microsoft/agent-framework #7397</strong><span>Python: LocalEvaluator with zero checks reports items as passed</span></div><em>mention</em></div>'
          focus_new = '<div class="audit-row audit-focus-row"><span class="pr-status merged"></span><div><strong>microsoft/agent-framework #7397</strong><span>Python: LocalEvaluator with zero checks reports items as passed</span></div><em>mention</em></div>'
          if focus_old not in s:
              raise SystemExit('Audit focus row not found')
          s = s.replace(focus_old, focus_new, 1)

          # Insert the simplified false-pass inspection state inside the existing evidence board.
          board_close = focus_new + '\n    </div></div><div class="scene-shade"></div>'
          proof = focus_new + '''\n    </div><div class="audit-proof" aria-hidden="true"><div class="audit-pass"><span class="audit-symbol">✓</span><strong>PASS</strong></div><div class="audit-verdict"><span class="audit-symbol">?</span><strong><span class="en-only">UNVERIFIED</span><span class="zh-only">未驗證</span></strong></div><div class="audit-checks"><span class="en-only">checks</span><span class="zh-only">檢查數</span>: <b>0</b></div><div class="audit-scan"></div></div></div><div class="scene-shade"></div>'''
          if board_close not in s:
              raise SystemExit('Audit board closing target not found')
          s = s.replace(board_close, proof, 1)

          # On mobile, keep the focused last row available even though later rows are normally trimmed.
          mobile_old = '.audit-row:nth-child(n+6){display:none}'
          mobile_new = '.audit-row:nth-child(n+6):not(.audit-focus-row){display:none}'
          if mobile_old not in s:
              raise SystemExit('Audit mobile row target not found')
          s = s.replace(mobile_old, mobile_new, 1)

          # Reduced-motion mode presents the contradiction statically.
          reduced_anchor = '@media(prefers-reduced-motion:reduce){'
          reduced_new = '@media(prefers-reduced-motion:reduce){.audit-proof{opacity:1!important}.audit-pass{opacity:0!important}.audit-verdict,.audit-checks{opacity:1!important}.audit-scan{display:none!important}'
          if reduced_anchor not in s:
              raise SystemExit('Reduced motion target not found')
          s = s.replace(reduced_anchor, reduced_new, 1)

          # Stretch only the interval from Audit -> Outro. Other scene intervals remain 1 unit.
          timeline_old = 'progress=clamp(-rect.top/travel),step=progress*(scenes.length-1),mobile=window.innerWidth<=760;'
          timeline_new = 'progress=clamp(-rect.top/travel),mobile=window.innerWidth<=760,durations=[1,1,1,1,1,2.2],timelineTotal=7.2,timelinePos=progress*timelineTotal;let step=scenes.length-1,cursor=0;for(let timelineIndex=0;timelineIndex<durations.length;timelineIndex++){const duration=durations[timelineIndex];if(timelinePos<=cursor+duration){step=timelineIndex+clamp((timelinePos-cursor)/duration);break}cursor+=duration}'
          if timeline_old not in s:
              raise SystemExit('Timeline target not found')
          s = s.replace(timeline_old, timeline_new, 1)

          # Add the false-pass narrative after the CueSheet scene-specific motion.
          js_anchor = "if(cast){const a=1-conflictIn;cast.style.opacity=String(sceneAlpha*a);cast.style.transform=`translate3d(${pointer.x*-8+rel*-28}px,${pointer.y*6+rel*30}px,0) scale(${1-Math.min(.07,Math.abs(rel)*.035)-conflictIn*.04})`;cast.style.zIndex='10'}}"
          js_add = js_anchor + "if(scene.dataset.scene==='5'){const phase=clamp(rel/.56),activity=scene.querySelector('.audit-activity'),proof=scene.querySelector('.audit-proof'),pass=scene.querySelector('.audit-pass'),checks=scene.querySelector('.audit-checks'),scan=scene.querySelector('.audit-scan'),verdict=scene.querySelector('.audit-verdict'),focusRow=scene.querySelector('.audit-focus-row'),focusStatus=focusRow?.querySelector('.pr-status'),focusIn=smooth(clamp((phase-.20)/.12)),simplify=smooth(clamp((phase-.40)/.10)),checksIn=smooth(clamp((phase-.54)/.08)),scanProgress=smooth(clamp((phase-.64)/.12)),verdictIn=smooth(clamp((phase-.74)/.10)),returnIn=smooth(clamp((phase-.86)/.12)),story=focusIn*(1-returnIn),proofIn=simplify*(1-returnIn),sceneAlpha=clamp(opacity*1.12);scene.querySelectorAll('.audit-row').forEach(row=>{const focus=row===focusRow,target=focus?1:1-story*.82;row.style.opacity=String(target);if(focus)row.style.transform=`scale(${1+story*.035})`});if(activity)activity.style.opacity=String(.88*(1-proofIn*.9));if(proof){proof.style.opacity=String(proofIn);proof.style.transform=`translate(-50%,calc(-50% + ${(1-proofIn)*10}px)) scale(${.97+proofIn*.03})`}if(pass){pass.style.opacity=String(proofIn*(1-verdictIn));pass.style.transform=`translate3d(0,${(1-proofIn)*8}px,0)`}if(checks){checks.style.opacity=String(checksIn*(1-returnIn));checks.style.transform=`translate3d(0,${(1-checksIn)*7}px,0)`}if(scan){const scanWindow=scanProgress*(1-verdictIn);scan.style.opacity=String(Math.sin(Math.PI*scanProgress)*(1-verdictIn));scan.style.left=`${8+scanProgress*84}%`}if(verdict){verdict.style.opacity=String(verdictIn*(1-returnIn));verdict.style.transform=`scale(${.96+verdictIn*.04})`}if(focusStatus){const pulse=Math.sin(Math.PI*returnIn);focusStatus.style.transform=`scale(${1+pulse*.18})`;focusStatus.style.filter=`drop-shadow(0 0 ${pulse*14}px rgba(130,80,223,${pulse*.72}))`}if(content){const introVisible=1-smooth(clamp((phase-.18)/.12)),outroVisible=smooth(clamp((phase-.9)/.1));content.style.opacity=String(sceneAlpha*Math.max(introVisible,outroVisible))}}"
          if js_anchor not in s:
              raise SystemExit('CueSheet JS anchor not found')
          s = s.replace(js_anchor, js_add, 1)

          # Safety: protect the hand-tuned portfolio copy.
          required = [
              "commerceTitle:'One flow.\\nChecked all the way through.'",
              "nocodeTitle:'Readable tests.\\nMaintainable locators.'",
              "cueTitle:'I test products.\\nI build them too.'",
              "recentTitle:'The same QA questions.\\nA newer kind of system.'",
              "recentTitle:'同一套 QA 邏輯\\n也能用來檢查 AI 工具'",
          ]
          for marker in required:
              if marker not in s:
                  raise SystemExit('Copy safety marker missing: ' + marker)

          if s.count('audit-focus-row') < 3:
              raise SystemExit('Audit focus story did not patch fully')
          if '--scroll-units:8.2' not in s or 'durations=[1,1,1,1,1,2.2]' not in s:
              raise SystemExit('Extended Audit timeline not applied')

          p.write_text(s)
          PY

          git diff --check

      - name: Commit story and remove helper
        shell: bash
        run: |
          rm .github/workflows/decision-audit-story.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/decision-audit-story.yml
          git commit -m 'Add Decision Audit false-pass scroll story'
          git push
