name: One-time CueSheet duplicate mobile cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cuesheet-remove-duplicate-mobile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove late CueSheet cast phone comeback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "if(cast){const a=Math.max(1-conflictIn,publish),lift=publish*(mobile?-14:-24),slide=publish*(mobile?18:38);cast.style.opacity=String(sceneAlpha*a);cast.style.transform=`translate3d(${pointer.x*-8+rel*-28+slide}px,${pointer.y*6+rel*30+lift}px,0) scale(${1-Math.min(.07,Math.abs(rel)*.035)+publish*(mobile?.12:.2)})`;cast.style.zIndex=publish>.5?'13':'10'}"
          new = "if(cast){const a=1-conflictIn;cast.style.opacity=String(sceneAlpha*a);cast.style.transform=`translate3d(${pointer.x*-8+rel*-28}px,${pointer.y*6+rel*30}px,0) scale(${1-Math.min(.07,Math.abs(rel)*.035)-conflictIn*.04})`;cast.style.zIndex='10'}"
          if old not in s:
              raise SystemExit('Expected CueSheet cast-phone motion target not found')
          s = s.replace(old, new, 1)
          if 'Math.max(1-conflictIn,publish)' in s:
              raise SystemExit('Late CueSheet cast-phone comeback still present')
          p.write_text(s)
          PY
          git diff --check

      - name: Commit cleanup and remove helper
        shell: bash
        run: |
          rm .github/workflows/cuesheet-remove-duplicate-mobile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/cuesheet-remove-duplicate-mobile.yml
          git commit -m 'Remove duplicate CueSheet mobile reappearance'
          git push

# trigger
